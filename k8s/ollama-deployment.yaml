apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
    app.kubernetes.io/part-of: llm-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 11434
              name: http

          env:
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: OLLAMA_HOST
            - name: OLLAMA_KEEP_ALIVE
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: OLLAMA_KEEP_ALIVE

          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "12Gi"

          # Startup probe — laisse le temps à Ollama de démarrer
          startupProbe:
            httpGet:
              path: /api/version
              port: 11434
            failureThreshold: 30
            periodSeconds: 10

          # Readiness probe — trafic envoyé seulement si Ollama répond
          readinessProbe:
            httpGet:
              path: /api/version
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness probe — redémarre le pod si Ollama est bloqué
          livenessProbe:
            httpGet:
              path: /api/version
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
