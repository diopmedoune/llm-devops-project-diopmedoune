apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
    app.kubernetes.io/part-of: llm-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: OLLAMA_BASE_URL

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          # Startup probe — laisse du temps au backend Python de démarrer (10min max)
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 60
            periodSeconds: 10

          # Readiness probe — vérifie que l'UI est prête à recevoir du trafic
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

          # Liveness probe — redémarre si le service est bloqué
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          volumeMounts:
            - name: webui-storage
              mountPath: /app/backend/data

      volumes:
        - name: webui-storage
          persistentVolumeClaim:
            claimName: webui-pvc
