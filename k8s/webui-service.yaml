apiVersion: v1
kind: Service
metadata:
  name: webui-service
  namespace: llm
  labels:
    app: open-webui
    app.kubernetes.io/part-of: llm-stack
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
